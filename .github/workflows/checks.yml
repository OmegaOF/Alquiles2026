name: Validación del sistema
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
      PHASE1_TEST_DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
      # Secuenciales: las suites usan únicamente la base CI descartable.
      PHASE11_MIGRATION_DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
      PHASE2_MIGRATION_DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
      PHASE3_MIGRATION_DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
      PHASE4_MIGRATION_DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
      PHASE5_MIGRATION_DATABASE_URL: mysql+pymysql://alquiles:local_only_change_me@127.0.0.1:3306/alquiles_phase1_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: alquiles_phase1_test
          MYSQL_USER: alquiles
          MYSQL_PASSWORD: local_only_change_me
          MYSQL_ROOT_PASSWORD: local_root_change_me
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: bash scripts/install.sh
      - run: bash scripts/check.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Crear cuenta descartable para navegador
        run: |
          .venv/bin/python - <<'PYCODE'
          import os, secrets, subprocess
          password = secrets.token_urlsafe(24)
          print("::add-mask::" + password)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("E2E_USERNAME=ci_admin\nE2E_PASSWORD=" + password + "\n")
          subprocess.run(["../.venv/bin/python", "-m", "app.bootstrap", "--username", "ci_admin", "--full-name", "Administrador de pruebas", "--password-stdin"], cwd="backend", input=password + "\n", text=True, check=True)
          PYCODE
      - name: Iniciar aplicaciones
        run: |
          (cd backend && ../.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1) &
          (cd frontend && npm run dev > /tmp/frontend.log 2>&1) &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/ready && curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log /tmp/frontend.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
